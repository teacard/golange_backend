schema: spec-driven

context: |
  # 休閒遊戲

  休閒放置型遊戲，玩家蒐集奇幻生物，看著牠們生活與探索。
  參考風格：旅行青蛙 × 神奇生物蒐集。

  ## 技術架構
  - 後端：Go + Gin + GORM + PostgreSQL 16（Docker）
  - 前端：Go + Ebitengine（遊戲引擎）
  - 前後端完全分離，透過 REST API 溝通
  - Logger：Logrus（interface 包裝，測試可注入 mock）
  - 設定管理：godotenv（.env 檔）

  ## 後端架構層次
  handler → flow（複雜跨資源）→ service（共用邏輯）→ repository → db
  簡單請求可跳過 flow：handler → service → repository → db

  ## 目錄結構
  - backend/handler/   ← API 處理（Controller）
  - backend/flow/      ← 跨資源複雜情境（Use Case）
  - backend/service/   ← 共用商業邏輯
  - backend/repository/← 泛型 BaseRepository[T] + Filters
  - backend/model/     ← 資料結構
  - frontend/          ← Ebitengine 遊戲前端（尚未開始）

  ## 資料庫慣例
  - 多語系文字統一放 creature_locales（creature_id + lang_code + name + description）
  - 可擴充欄位使用 JSONB（colors、special_parts、animation）
  - special_parts 格式：[{"code":"part_code","color":"#RRGGBB（選填）"}]
  - 所有 model 欄位需有 GORM comment

  ## 開發慣例
  - 新增 API 前先在 router/router.go 登記路由
  - 新增 model 後在 db/db.go 的 AutoMigrate 加入
  - 生物 ID 格式：creature_<英文名稱小寫>
  - 敏感資訊放 .env，不進 git

rules:
  proposal:
    - 列出 Affected specs 和 Affected code
    - 後端與前端任務分開列於 tasks.md
    - 標明這次變更不包含的項目（Non-goals）
  tasks:
    - 後端任務與前端任務分成不同區塊
    - 每個任務粒度以單一函式或單一檔案為單位
