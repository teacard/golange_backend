name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/game-backend:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to WSL Test
    runs-on: self-hosted
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Pull latest docker config
        run: |
          cd ~/docker
          git pull

      - name: Pull new backend image
        run: |
          cd ~/docker
          docker compose pull game_backend

      - name: Restart containers
        run: |
          cd ~/docker
          docker compose up -d
