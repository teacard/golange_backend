# workflow 名稱，顯示在 GitHub Actions 頁面
name: CI/CD

# ────────────────────────────────────────────
# 全域環境變數：Go 版本統一在此維護
# 要升版只需改這一個地方，CI 工具鏈與 Docker image 都會跟著更新
# ────────────────────────────────────────────
env:
  GO_VERSION: "1.26"

# 觸發條件
on:
  # 對 develop 分支發起 PR 時觸發
  pull_request:
    branches: [develop]
  # 直接推送到 develop 分支時觸發
  push:
    branches: [develop]

jobs:
  # ────────────────────────────────────────────
  # Job 1：CI（程式碼品質與測試）
  # PR 與 push 都會執行
  # ────────────────────────────────────────────
  ci:
    name: CI
    # 使用 GitHub 提供的 Ubuntu 最新版 runner
    runs-on: ubuntu-latest
    steps:
      # 檢出專案原始碼到 runner
      - uses: actions/checkout@v4

      # 安裝 Go 環境，版本統一讀取頂層 env.GO_VERSION
      # cache: true 快取模組下載，加速後續執行
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 安裝 swag CLI 並產生 swagger docs（main.go import docs/ 須先產生才能編譯）
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init

      # 執行 golangci-lint 靜態分析
      # 釘住 v2.12.2：golangci-lint v2.x 系列首個支援 Go 1.26 的穩定版
      # version: latest 先前會拿到 v1.64.8（以 Go 1.24 編譯），無法分析 Go 1.25+ 模組
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      # 執行所有套件的測試（./... 代表遞迴所有子目錄）
      - name: go test
        run: go test ./...

      # 確認整個專案可以成功編譯
      - name: go build
        run: go build ./...

  # ────────────────────────────────────────────
  # Job 2：Build & Push Docker Image
  # 只在 push 到 develop 時執行（不跑在 PR）
  # 必須 CI job 通過才會觸發
  # ────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # 必須 ci job 成功才接著跑
    needs: ci
    # 只在 push 事件且目標是 develop 分支時執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      # 讀取原始碼
      contents: read
      # 推送 Docker image 到 GitHub Container Registry (GHCR)
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 啟用 Docker Buildx，支援多平台建置與 BuildKit 進階快取
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用 GITHUB_TOKEN（自動生成，無需手動設定 secret）登入 GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 建置 Docker image 並推送到 GHCR
      # build-args 把 GO_VERSION 傳入 Dockerfile 的 ARG，確保 image 用相同版本
      # cache-from / cache-to 使用 GitHub Actions 快取層，加速重複建置
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # image tag 格式：ghcr.io/<owner>/game-backend:develop
          tags: ghcr.io/${{ github.repository_owner }}/game-backend:develop
          # 把 GO_VERSION 傳進 Dockerfile，讓 Docker build 用同一個版本
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # Job 3：Deploy（觸發 game-docker repo 的 VPS 部署）
  # 必須 build-push 成功才執行
  # ────────────────────────────────────────────
  deploy:
    name: Trigger VPS Deploy
    # 透過 GitHub API 觸發，不需要 self-hosted runner
    runs-on: ubuntu-latest
    # 必須 build-push job 成功才接著跑
    needs: build-push
    # 同樣只在 push 到 develop 時執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      # 呼叫 GitHub API 觸發 game-docker repo 的 deploy-develop workflow
      # DEPLOY_PAT：需有 actions:write 權限的 PAT，設定在本 repo 的 secrets
      - name: Trigger game-docker deploy workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/teacard/game-docker/actions/workflows/deploy-develop.yml/dispatches \
            -d '{"ref":"develop"}'
