# workflow 名稱，顯示在 GitHub Actions 頁面
name: CI/CD

# 觸發條件
on:
  # 對 develop 分支發起 PR 時觸發
  pull_request:
    branches: [develop]
  # 直接推送到 develop 分支時觸發
  push:
    branches: [develop]

jobs:
  # ────────────────────────────────────────────
  # Job 1：CI（程式碼品質與測試）
  # PR 與 push 都會執行
  # ────────────────────────────────────────────
  ci:
    name: CI
    # 使用 GitHub 提供的 Ubuntu 最新版 runner
    runs-on: ubuntu-latest
    steps:
      # 檢出專案原始碼到 runner
      - uses: actions/checkout@v4

      # 安裝 Go 環境，版本從 go.mod 的 go 指令自動讀取
      # cache: true 快取模組下載，加速後續執行
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 執行 golangci-lint 靜態分析，version: latest 使用最新穩定版
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      # 執行所有套件的測試（./... 代表遞迴所有子目錄）
      - name: go test
        run: go test ./...

      # 確認整個專案可以成功編譯
      - name: go build
        run: go build ./...

  # ────────────────────────────────────────────
  # Job 2：Build & Push Docker Image
  # 只在 push 到 develop 時執行（不跑在 PR）
  # 必須 CI job 通過才會觸發
  # ────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # 必須 ci job 成功才接著跑
    needs: ci
    # 只在 push 事件且目標是 develop 分支時執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      # 讀取原始碼
      contents: read
      # 推送 Docker image 到 GitHub Container Registry (GHCR)
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 啟用 Docker Buildx，支援多平台建置與 BuildKit 進階快取
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用 GITHUB_TOKEN（自動生成，無需手動設定 secret）登入 GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 建置 Docker image 並推送到 GHCR
      # cache-from / cache-to 使用 GitHub Actions 快取層，加速重複建置
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Docker build context 為專案根目錄
          context: .
          # 指定 Dockerfile 路徑
          file: ./Dockerfile
          # push: true 表示建置後自動推送（false 只建置不推）
          push: true
          # image tag 格式：ghcr.io/<owner>/game-backend:develop
          tags: ghcr.io/${{ github.repository_owner }}/game-backend:develop
          # 從 GHA 快取讀取舊 layer
          cache-from: type=gha
          # 把新 layer 寫回 GHA 快取（mode=max 快取所有 layer）
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # Job 3：Deploy（部署到自架 WSL 測試機）
  # 必須 build-push 成功才執行
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to WSL Test
    # 使用本地 self-hosted runner（WSL 環境）
    runs-on: self-hosted
    # 必須 build-push job 成功才接著跑
    needs: build-push
    # 同樣只在 push 到 develop 時執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      # 拉取最新的 docker compose 設定（存放在本地 ~/docker 目錄）
      - name: Pull latest docker config
        run: |
          cd ~/docker
          git pull

      # 拉取剛推上去的新版 backend image
      - name: Pull new backend image
        run: |
          cd ~/docker
          docker compose pull game_backend

      # 以新 image 重啟所有容器（-d 為背景執行）
      - name: Restart containers
        run: |
          cd ~/docker
          docker compose up -d
